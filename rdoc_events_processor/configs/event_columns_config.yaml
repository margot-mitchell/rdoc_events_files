# Configuration file for event file column mapping
# This file defines which columns from the BIDS data to include in the event files

# Columns to include from the original BIDS data (applied to ALL tasks)
# Format: "bids_column_name": "event_file_column_name"
# Leave event_file_column_name empty to keep the same name as bids_column_name
bids_columns:
  # DIRECT MAPPING FOR ALL TASKS: No manipulation beyond initial mapping
  "trial_id": "trial_id"
  # PROCESSED FOR ALL TASKS: 
  "time_elapsed": "onset"   # Converts milliseconds to seconds, normalizes to trigger_start, and recalculates for span_recall sequences
  # PROCESSED FOR SOME TASKS: 
  "stimulus_duration": "duration"   # May be replaced with trial_duration (for test_trial rows) or block_duration (for fmri_wait_block_initial_end)
  "rt": "response_time"   # Used in span task sequence onset recalculations (both opSpan and simpleSpan convert from ms to seconds before recalculation)
  "correct_trial": "acc"   # Recalculated for opSpan, simpleSpan, and opOnlySpan tasks based on task-specific logic


# Task-specific columns (only applied to their respective tasks)
task_specific_columns:
  # Flanker task
  flanker:
    "flanker": "flanker_letter"
    "center_letter": "center_letter"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Spatial TS
  spatialTS:
    "whichQuadrant": "whichQuadrant"
    "spatial_cue": "spatial_cue"
    "shape": "shape"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Cued TS
  cuedTS:
    "cue": "cue"
    "task": "task"
    "task_condition": "task_condition"
    "cue_condition": "cue_condition"
    "stim_number": "stim_number"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Nback
  nBack:
    "delay": "delay"
    "probe": "current_letter"
    "letter_case": "letter_case"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Go Nogo
  goNogo:
    # Note: go_nogo_condition are calculated and appended to rdoc columns
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Stop Signal
  stopSignal:
    "SSD": "SSDelay"
    "SS_duration": "SS_duration"
    "stim": "stim"
    "correct_response": "correct_response"
    "response": "key_press"
    # Note: trial_type, stop_signal_condition, stop_accuracy, and go_accuracy are calculated and appended to rdoc columns

  axCPT:
    "cue_letter": "cue_letter"
    "probe_letter": "probe_letter"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  spatialCueing:
    "cue_location": "cue_location"
    "stim_location": "stim_location"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  "visualSearch":
    "target_present": "target_present"
    "num_stimuli": "num_stimuli"
    "target_rectangle_location": "target_rectangle_location"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  "stroop":
    "condition": "trial_type"
    "response": "key_press"
    "stim_color": "stim_color"
    "stim_word": "stim_word"
    "correct_response": "correct_response"
  
  "opSpan":
    "correct_spatial_judgement_key": "correct_response"
    "response": "response"
    "grid_symmetry": "grid_symmetry"
    "spatial_location": "spatial_location"
    "condition": "trial_type" # manipulated to set "span" for span trials (dropbox has "operation" for ALL rows)
    # Note: moving_through_grid_timestamps, cell_order_through_grid, valid_responses, duplicate_responses, 
    # extra_responses, valid_responses_timestamps, duplicate_responses_timestamps, extra_responses_timestamps, 
    # correct_cell_order, and correct_navigation_response are used for processing but may not exist in input files
    # and are handled gracefully during processing with .get() methods.
    # Note: valid_cell_selection, invalid_cell_selection, correct_cell, and cell_movement are created by span processing

  "opOnlySpan":
    "correct_spatial_judgement_key": "correct_response"
    "grid_symmetry": "grid_symmetry"
    "condition": "trial_type"
    "response": "response"

  "simpleSpan":
    "spatial_location": "spatial_location"
    "condition": "trial_type"
    "response": "response"
    # Note: moving_through_grid_timestamps, cell_order_through_grid, valid_responses, duplicate_responses, 
    # extra_responses, valid_responses_timestamps, duplicate_responses_timestamps, extra_responses_timestamps, 
    # and correct_cell_order are used for processing but may not exist in input files
    # and are handled gracefully during processing with .get() methods.
    # Note: valid_cell_selection, invalid_cell_selection, correct_cell, and cell_movement are created by span processing

# Columns to exclude from specific tasks
exclude_columns_by_task:
  "opSpan":
    - "moving_through_grid_timestamps"
    - "cell_order_through_grid"
    - "extra_responses_timestamps"
    - "duplicate_responses_timestamps"
    - "valid_responses_timestamps"
    - "correct_navigation_response"
    - "valid_responses"
    - "duplicate_responses"
    - "extra_responses"
    - "correct_cell_order"
  "simpleSpan":
    - "moving_through_grid_timestamps"
    - "cell_order_through_grid"
    - "valid_responses"
    - "valid_responses_timestamps"
    - "duplicate_responses"
    - "duplicate_responses_timestamps"
    - "extra_responses"
    - "extra_responses_timestamps"
    - "correct_cell_order"
    - "correct_navigation_response"



# Output format settings
output_settings:
  # File format for event files
  file_format: "tsv"  # or "csv"
  
  # Separator for TSV files
  separator: "\t"
  
  # Include header row
  include_header: true
  
  # Float precision for numeric columns
  float_precision: 6
