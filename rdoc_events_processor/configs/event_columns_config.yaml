# Configuration file for event file column mapping
# This file defines which columns from the BIDS data to include in the event files

# Columns to include from the original BIDS data (applied to ALL tasks)
# Format: "bids_column_name": "event_file_column_name"
# Leave event_file_column_name empty to keep the same name as bids_column_name
bids_columns:
  "time_elapsed": "onset"
  "stimulus_duration": "duration"
  "trial_id": "trial_id"
  "rt": "response_time"
  "correct_trial": "acc"

# Task-specific columns (only applied to their respective tasks)
task_specific_columns:
  # Flanker task
  flanker:
    "flanker": "flanker_letter"
    "center_letter": "center_letter"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Spatial TS
  spatialTS:
    "whichQuadrant": "whichQuadrant"
    "spatial_cue": "spatial_cue"
    "shape": "shape"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Cued TS
  cuedTS:
    "cue": "cue"
    "task": "task"
    "task_condition": "task_condition"
    "cue_condition": "cue_condition"
    "stim_number": "stim_number"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Nback
  nBack:
    "delay": "delay"
    "probe": "current_letter"
    "letter_case": "letter_case"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Go Nogo
  goNogo:
    # Note: go_nogo_condition will have to be calculated and appended to rdoc columns
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  # Stop Signal
  stopSignal:
    "SSD": "SSDelay"
    "SS_duration": "SS_duration"
    "stim": "stim"
    "correct_response": "correct_response"
    "response": "key_press"
    # Note: trial_type, stop_signal_condition, stop_accuracy, and go_accuracy are calculated and appended to rdoc columns

  axCPT:
    "cue_letter": "cue_letter"
    "probe_letter": "probe_letter"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  spatialCueing:
    "cue_location": "cue_location"
    "stim_location": "stim_location"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  "visualSearch":
    "target_present": "target_present"
    "num_stimuli": "num_stimuli"
    "target_rectangle_location": "target_rectangle_location"
    "correct_response": "correct_response"
    "response": "key_press"
    "condition": "trial_type"

  "stroop":
    "condition": "trial_type"
    "response": "key_press"
    "stim_color": "stim_color"
    "stim_word": "stim_word"
    "correct_response": "correct_response"
  
  "opSpan":
    "correct_spatial_judgement_key": "correct_response"
    "grid_symmetry": "grid_symmetry"
    "spatial_location": "spatial_location"
    "condition": "trial_type"
    "valid_responses_timestamps": "valid_responses_timestamps"  # needed for processing but dropped from output
    "duplicate_responses_timestamps": "duplicate_responses_timestamps"  # needed for processing but dropped from output
    "extra_responses_timestamps": "extra_responses_timestamps"  # needed for processing but dropped from output
    "correct_navigation_response": "correct_navigation_response"  # needed for processing but dropped from output
    "valid_responses": "valid_responses"  # needed for processing but dropped from output
    "duplicate_responses": "duplicate_responses"  # needed for processing but dropped from output
    "extra_responses": "extra_responses"  # needed for processing but dropped from output
    "correct_cell_order": "correct_cell_order"  # needed for processing but dropped from output

  "opOnlySpan":
    "correct_spatial_judgement_key": "correct_response"
    "grid_symmetry": "trial_type"
    "response": "response"

  "simpleSpan":
    "spatial_location": "spatial_location"
    "condition": "trial_type"
    # Add the required input columns for processing
    "moving_through_grid_timestamps": "moving_through_grid_timestamps"  # needed for processing but dropped from output
    "cell_order_through_grid": "cell_order_through_grid"  # needed for processing but dropped from output
    "valid_responses": "valid_responses"  # needed for processing but dropped from output
    "valid_responses_timestamps": "valid_responses_timestamps"  # needed for processing but dropped from output
    "duplicate_responses": "duplicate_responses"  # needed for processing but dropped from output
    "duplicate_responses_timestamps": "duplicate_responses_timestamps"  # needed for processing but dropped from output
    "extra_responses": "extra_responses"  # needed for processing but dropped from output
    "extra_responses_timestamps": "extra_responses_timestamps"  # needed for processing but dropped from output
    "correct_cell_order": "correct_cell_order"  # needed for processing but dropped from output
    # Note: valid_cell_selection, invalid_cell_selection, correct_cell, and cell_movement
    # are created by the process_simplespan_data function from the input list columns

# Columns to exclude from specific tasks
exclude_columns_by_task:
  "opSpan":
    - "extra_responses_timestamps"
    - "duplicate_responses_timestamps"
    - "valid_responses_timestamps"
    - "correct_navigation_response"
    - "valid_responses"
    - "duplicate_responses"
    - "extra_responses"
    - "correct_cell_order"
  "simpleSpan":
    - "moving_through_grid_timestamps"
    - "cell_order_through_grid"
    - "valid_responses"
    - "valid_responses_timestamps"
    - "duplicate_responses"
    - "duplicate_responses_timestamps"
    - "extra_responses"
    - "extra_responses_timestamps"
    - "correct_cell_order"



# Output format settings
output_settings:
  # File format for event files
  file_format: "tsv"  # or "csv"
  
  # Separator for TSV files
  separator: "\t"
  
  # Include header row
  include_header: true
  
  # Float precision for numeric columns
  float_precision: 6
